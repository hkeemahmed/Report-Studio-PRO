services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rsp, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}", POSTGRES_DB: rsp }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  backend:
    build: { context: .., dockerfile: docker/Dockerfile.backend }
    env_file: ../.env
    environment:
      RSP_DATABASE_URL: postgresql+psycopg://rsp:${POSTGRES_PASSWORD}@db/rsp
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: [files:/srv/backend/storage]
  web:
    build: { context: .., dockerfile: docker/Dockerfile.web }
    ports: ["8080:80"]
volumes: { pgdata: {}, files: {} }
