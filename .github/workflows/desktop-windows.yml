name: Windows installer
# Builds the Report Studio PRO Windows installers (NSIS .exe + MSI) on a Windows runner.
# Trigger manually (Actions → Windows installer → Run workflow) or by pushing a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Backend dependencies
        run: |
          pip install -r backend/requirements.txt pyinstaller
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Build local backend sidecar
        working-directory: backend
        run: python build_sidecar.py
      - name: Smoke-test sidecar
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/binaries/rsp-backend-*.exe | Select-Object -First 1
          $env:RSP_DATABASE_URL = "sqlite:///$($env:RUNNER_TEMP -replace '\\','/')/smoke.db"
          $env:RSP_STORAGE_DIR = "$env:RUNNER_TEMP/smoke"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 15
          if ((Invoke-RestMethod http://127.0.0.1:8765/health).status -ne "ok") { exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Frontend dependencies
        run: npm ci
      - name: Build installers
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: ReportStudioPRO-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
